<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Electronica</title>
</head>

<body class="cuerpo">
    <nav>
        <div class="logo">
            <img src="Logo.png"
                alt="logo">
            <p>NEON WAVE FEST</p>
        </div>
    </nav>
    <div class="informacion">
        <p class="nombreFestival">Festival de musica electronica</p>
        <p class="fechaFestival">12 de Junio - 14 de Junio en Valencia</p>
    </div>
    <div>
        <img src="Cartel.png"
            class="imagenCartel">
    </div>
    <div class="divDescuento">
        <p>Código de descuento:</p>
        <p class="descuento">NEON20</p>
    </div>

    <footer>
        <div class="footer">
            <p>Instagram: @neonwavefest <br> Facebook: @neonwavefest <br> Twitter: @neonwavefest
            </p>
        </div>
    </footer>


    <style>
        .cuerpo {
            background-color: rgb(108, 107, 107);

        }


        /*CSS DE NAV*/
        nav {
            background-color: #35394c;
            position: relative;
            text-align: right;
            justify-content: center;
            align-items: center;

        }
        

        .logo {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo p {
            font-size: 30px;
            margin: 0;
            font-family: "Kings", cursive;
            font-size: 35px;
            font-weight: bold;
            color: #DC2EFF;
        }

        .logo img {
            height: 60px;

        }



        .nombreFestival {
            font-size: 50px;
            color: #DC2EFF;
            font-family: "Bebas Neue", sans-serif;
            text-align: center;
        }

        .fechaFestival {
            font-size: 25px;
            font-family: "Bebas Neue", sans-serif;

        }

        .imagenCartel {
            max-width: 100%;

        }

        .divDescuento {
            font-size: 35px;

        }

        .descuento {
            border-style: dotted;
            width: 135px;
            height: 40px;
            color: #e061fa;
        }

        .footer {
            font-size: 35px;
            text-align: right;
            color: #e061fa;
        }
    </style>
</body>

</html>
